apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: users-cleanup-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-cleanup
spec:
  replicas: 1
  # The volume can only be mounted by one pod, and two schedulers must never run at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: users-cleanup
  template:
    metadata:
      labels:
        app: users-cleanup
      annotations:
        # Okteto injects OKTETO_CONTEXT and OKTETO_TOKEN. The token acts as the owner
        # of this namespace, who must be an Okteto admin.
        dev.okteto.com/inject-token: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: users-cleanup
          image: ${OKTETO_BUILD_APP_IMAGE}
          ports:
            - containerPort: 8080
          env:
            - name: DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: users-cleanup-data
---
apiVersion: v1
kind: Service
metadata:
  name: users-cleanup
  annotations:
    # A private endpoint: only the Okteto users with access to this namespace can open it.
    dev.okteto.com/auto-ingress: "private"
spec:
  type: ClusterIP
  selector:
    app: users-cleanup
  ports:
    - port: 8080
      targetPort: 8080
